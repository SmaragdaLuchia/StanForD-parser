[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s4d-tools"
version = "0.1.0"
description = "s4d_tools is a library designated to parse, transform and aggregate the data of StanForD files."
readme = "README.md"
license = {file = "LICENSE"}

authors = [
    {name = "Smaragda Luchia Sarana", email = "smaragda.sarana@gmail.com"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["stanford", "forest", "harvester", "data", "parsing"]

dependencies = [
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Documentation = "https://smaragdaluchia.github.io/s4d_tools/#/"

[tool.setuptools.packages.find]
where = ["."]
include = ["s4d_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
